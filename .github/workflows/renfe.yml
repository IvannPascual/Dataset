name: Captura trenes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: captura-renfe
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Posiciones Renfe
        continue-on-error: true
        run: python collector/renfe.py

      - name: Retrasos oficiales larga distancia
        continue-on-error: true
        run: python collector/retrasos_ld.py

      - name: Avisos de incidencias
        continue-on-error: true
        run: python collector/avisos.py

      - name: Tiempo (cada 15 min)
        continue-on-error: true
        run: |
          [ $(( 10#$(date +%M) % 15 )) -lt 5 ] || exit 0
          python collector/meteo.py

      - name: Estaciones y festivos (una vez al día)
        continue-on-error: true
        run: |
          [ "$(TZ=Europe/Madrid date +%H)" = "04" ] && [ $(( 10#$(date +%M) )) -lt 5 ] || [ ! -f data/estaciones.csv ] || exit 0
          python collector/estaciones.py
          python collector/festivos.py

      - name: Guardar en el repo
        run: |
          git config user.name "captura-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "Captura $(TZ=Europe/Madrid date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
